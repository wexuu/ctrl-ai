[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ctrl-ai"
version = "0.1.0"
description = "A security gateway for AI agents: policy, masking, governance, limits and audit for model and MCP tool traffic."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6",
    "jsonschema>=4",
    "cryptography>=42",
    "redis>=5",
]

[project.optional-dependencies]
# The admin panel and dashboard (src/ctrl_ai/admin).
admin = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
]
# Tests, the keyless stub servers, linting and type checking.
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "mcp>=1.0",
    "ruff>=0.16",
    "pyright>=1.1",
    "pre-commit>=4",
]

[project.urls]
Repository = "https://github.com/wexuu/ctrl-ai"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ctrl_ai.admin" = ["static/*"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["tests/e2e/runtime"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL"]
ignore = [
    "E501",    # the formatter wraps code; comments and strings may run longer
    "RUF001",  # tests and detectors use confusable and zero-width characters on purpose
    "RUF002",
    "RUF003",
    "PLR2004", # magic values: thresholds and HTTP codes read better inline than as named constants
]

[tool.ruff.lint.pylint]
# Row builders, dashboard views and the semantic decision take their inputs flat and named.
max-args = 10
max-positional-args = 7
# Decision ladders (governance, break-glass, verdict parsing) return as soon as a rule applies.
max-returns = 12
# The dashboard views and the semantic decision are one pass each over a request's fields.
max-branches = 17
max-statements = 60

[tool.ruff.lint.per-file-ignores]
# FastAPI dependencies and query defaults are function calls by design.
"src/ctrl_ai/admin/routes/*.py" = ["B008"]
# The engine's constructor takes every collaborator by keyword.
"src/ctrl_ai/pipeline/engine.py" = ["PLR0913"]
# Optional dependencies (LiteLLM, redis, cryptography) are imported where they are used.
"src/ctrl_ai/adapters/litellm/guardrail.py" = ["PLC0415"]
"src/ctrl_ai/core/state.py" = ["PLC0415"]
"src/ctrl_ai/detect/masking.py" = ["PLC0415"]
"src/ctrl_ai/semantic/models.py" = ["PLC0415"]
# Fixtures are imported so pytest sees them, then named again as test parameters. Tests import
# modules after setting the environment, write hidden characters on purpose, and build
# argument-heavy fixtures.
"tests/**" = ["B008", "F811", "PLC0415", "PLE2502", "PLE2515", "PLR0911", "PLR0913", "PLR0917"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
# LiteLLM runs only inside the pinned image; the host never installs it.
reportMissingImports = "warning"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = [
    "live: uses real credentials from .env and a gateway started with `make up`; excluded by default",
]
