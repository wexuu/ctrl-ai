name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --quiet --upgrade pip
          .venv/bin/python -m pip install --quiet -e ".[admin,dev]"
      - name: Ruff
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: Pyright
        run: .venv/bin/pyright
      - name: Unit tests
        run: .venv/bin/python -m pytest tests/unit tests/policy -q

  e2e:
    name: End-to-end tests (keyless stub stack)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --quiet -e ".[admin,dev]"
      - name: Start the test stack
        run: make test-up
      - name: End-to-end tests
        run: make test-e2e
      - name: Gateway logs on failure
        if: failure()
        run: docker compose --project-directory . -f deploy/docker/compose.yml -f deploy/docker/compose.test.yml -p ctrl-ai-test --env-file tests/e2e/test.env logs --no-color gateway ui | tail -200
      - name: Stop the test stack
        if: always()
        run: make test-down
