# Prometheus for ctrl-ai: scrapes the OpenTelemetry Collector's metrics endpoint,
# which serves the span metrics (call counts and duration histograms per span and model).
global:
  scrape_interval: 10s
  evaluation_interval: 30s
scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
