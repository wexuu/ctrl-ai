# Internal ALB (not internet-facing): the gateway is reached from the organisation's network only.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ctrl-ai
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-central-1:<account>:certificate/<id>
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /health/liveliness
spec:
  ingressClassName: alb
  tls:
    - hosts: [ai-gateway.example.internal, ai-control.example.internal]
  rules:
    - host: ai-gateway.example.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: gateway, port: {number: 4000}}}
    - host: ai-control.example.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: ui, port: {number: 4100}}}
