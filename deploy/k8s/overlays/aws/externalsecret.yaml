# Secrets come from AWS Secrets Manager via External Secrets Operator; nothing secret is in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ctrl-ai-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: aws-secrets-manager}
  target: {name: ctrl-ai-secrets, creationPolicy: Owner}
  dataFrom:
    - extract: {key: ctrl-ai/gateway}
