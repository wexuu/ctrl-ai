# Laptop cluster (kind or minikube): one replica, NodePort, Redis in the cluster, secrets from a
# git-ignored local file. Create it from secrets.env.example first (make k8s-render does it).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - redis.yaml
secretGenerator:
  - name: ctrl-ai-secrets
    envs: [secrets.env]
    options: {disableNameSuffixHash: true}
patches:
  - target: {kind: Deployment, name: gateway}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 1}
      - {op: replace, path: /spec/template/spec/containers/0/resources/requests, value: {cpu: 250m, memory: 512Mi}}
  - target: {kind: HorizontalPodAutoscaler, name: gateway}
    patch: |-
      - {op: replace, path: /spec/minReplicas, value: 1}
      - {op: replace, path: /spec/maxReplicas, value: 2}
  - target: {kind: PodDisruptionBudget, name: gateway}
    patch: |-
      - {op: replace, path: /spec/minAvailable, value: 0}
  - target: {kind: Service, name: gateway}
    patch: |-
      - {op: add, path: /spec/type, value: NodePort}
      - {op: add, path: /spec/ports/0/nodePort, value: 30400}
  - target: {kind: Service, name: ui}
    patch: |-
      - {op: add, path: /spec/type, value: NodePort}
      - {op: add, path: /spec/ports/0/nodePort, value: 30410}
  - target: {kind: PersistentVolumeClaim, name: ctrl-ai-state}
    patch: |-
      - {op: replace, path: /spec/accessModes, value: [ReadWriteOnce]}
