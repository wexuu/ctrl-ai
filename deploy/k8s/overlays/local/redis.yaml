# Single-replica Redis for the laptop cluster (shared counters: loops, budgets). On AWS: ElastiCache.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: {app.kubernetes.io/name: redis}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: redis}
  template:
    metadata:
      labels: {app.kubernetes.io/name: redis}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: redis
          image: redis:8.2-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - {name: redis, containerPort: 6379}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: {app.kubernetes.io/name: redis}
  ports:
    - {name: redis, port: 6379, targetPort: redis}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: redis}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: gateway}
      ports:
        - {port: 6379, protocol: TCP}
